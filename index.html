<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахматная школа</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://sdk.games.s3.yandex.net/sdk.js"></script>
</head><body>
<header>
  <b class="brand" id="brand">♞</b>
  <nav>
    <button data-go="home" aria-label="Главное меню">⌂</button><button data-go="play">♟ Играть</button><button data-go="learn">🎓 Обучение</button><button data-go="train">🧩 Задачи</button><button data-go="online">🌐 Онлайн</button><button data-go="profile" aria-label="Профиль">👤</button>
  </nav>
  <span id="elo"></span>
</header>
<main id="main"></main>
<div id="startupOverlay" class="startup-overlay"><div class="startup-card"><div class="startup-mark">♞</div><h2>Шахматная школа</h2><p id="startupText">Подготавливаем игру…</p><div class="startup-bar"><i></i></div></div></div>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/sound.js"></script>
<script src="js/platform.js"></script>
<script src="js/content.js"></script>
<script src="js/pieces.js"></script>
<script src="js/board.js"></script>
<script src="js/online.js"></script>
<script src="js/app.js"></script>

<script>
window.addEventListener('error', function(e){
  if (document.body && !document.getElementById('fatalError')) {
    const box=document.createElement('div'); box.id='fatalError'; box.style.cssText='position:fixed;inset:0;z-index:99999;background:#1f1e1c;color:#fff;padding:28px;font:16px/1.5 system-ui;display:flex;align-items:center;justify-content:center;text-align:left';
    box.innerHTML='<div style="max-width:760px"><h2>Ошибка загрузки игры</h2><p>Интерфейс не смог запустить один из модулей. Обновите страницу. Если ошибка повторится, пришлите этот текст:</p><pre style="white-space:pre-wrap;background:#111;padding:14px;border-radius:8px">'+String(e.error?.stack||e.message||'Неизвестная ошибка').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre><button onclick="location.reload()" style="padding:10px 16px">Обновить</button></div>';
    document.body.appendChild(box);
  }
});
window.addEventListener('unhandledrejection', function(e){
  const err=e.reason; window.dispatchEvent(new ErrorEvent('error',{message:String(err?.message||err),error:err}));
});
</script>
</body></html>
